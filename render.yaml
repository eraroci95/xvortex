# Render Blueprint: API (Python web service) and frontend (static site).
services:
  - type: web
    name: xvortex-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://app.xvortex.se
      - key: TRUSTED_PROXY_HOPS
        value: "1"           # proxies that append to X-Forwarded-For; check the README after first deploy
      - key: PASSWORD_HASH_CONCURRENCY
        value: "2"           # password hashes allowed at once (about 64 MiB each; the instance has 512 MB)
      - key: ALPHAVANTAGE_API_KEY
        sync: false          # optional: free key from alphavantage.co; without it prices are unavailable
      - key: ALPHAVANTAGE_DAILY_LIMIT
        value: "20"          # free plan allows 25 a day; this app stops at 20
      - key: ADMIN_EMAIL
        sync: false          # first administrator (used only if no users exist yet)
      - key: ADMIN_PASSWORD
        sync: false          # 12+ characters; delete this variable after first login

  - type: web
    name: xvortex-app
    runtime: static
    rootDir: frontend
    buildCommand: (npm ci || npm install) && npm run build   # npm ci once package-lock.json is committed
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.xvortex.se
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
