name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xvortex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Unit and API tests run on in-memory SQLite (see tests/conftest.py).
      - run: pytest -q
      # The real schema is Postgres: the migration must apply, match the models, and roll back.
      - name: Migrations apply, match the models and roll back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xvortex
          SECRET_KEY: ci-only
          ENVIRONMENT: development
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Reproducible once frontend/package-lock.json is committed; works without it until then.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      # Type-checks (tsc --noEmit) and builds.
      - run: npm run build
